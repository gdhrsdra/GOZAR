<style>
/* ========== Reset & Foundations ========== */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent;text-size-adjust:100%;text-rendering:optimizeLegibility}
html,body{height:100%}
body{margin:0;color:var(--text);background:var(--bg);font-family:var(--font-fa);font-feature-settings:"ss01","ss02";line-height:1.6;transition:background var(--dur-med) var(--ease),color var(--dur-med) var(--ease);-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang="en"] body{font-family:var(--font-en)}
html[lang="en"] .fa-only{display:none !important}
html[lang="fa"] .en-only{display:none !important}
h1,h2,h3,h4,h5,p,ul,figure{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
ul{list-style:none;padding:0}
img,svg{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px;transition:outline-offset var(--dur-fast) var(--ease)}
::selection{background:#B6862F4D;background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--text)}

/* ========== Tokens ========== */
:root{
--font-fa:'Vazirmatn',system-ui,sans-serif;
--font-en:'Manrope',system-ui,sans-serif;
--radius-xs:8px;--radius-sm:12px;--radius-md:16px;--radius-lg:22px;--radius-xl:28px;--radius-pill:999px;
--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;--space-16:64px;--space-20:80px;
--ease:cubic-bezier(.4,0,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
--dur-fast:140ms;--dur-med:220ms;--dur-slow:380ms;
--b1:#A6453F;--b1-soft:#A6453F1a;
--b2:#C1631E;--b2-soft:#C1631E1a;
--b3:#8C8578;--b3-soft:#8C85781a;
--b4:#B5527A;--b4-soft:#B5527A1a;
--b5:#6FA8C9;--b5-soft:#6FA8C91a;
--b6:#1F3A5F;--b6-soft:#1F3A5F1a;
--b8:#C9A227;--b8-soft:#C9A2271a;
--b9:#3E8E52;--b9-soft:#3E8E521a;}
html[data-theme="light"]{
--bg:#EEEBE2;--bg-subtle:#E6E2D6;
--card:#FFFFFF;--card-hover:#FDFBF4;
--text:#211D18;--text-muted:#6E6558;--text-faint:#9C9384;
--border:#DEDACD;--border-strong:#CFC9B9;
--accent:#B6862F;--accent-strong:#8F6A21;--accent-ink:#3A2C0E;
--header-bg:rgba(238,235,226,.78);
--shadow-1:0 1px 2px rgba(33,29,24,.06),0 1px 1px rgba(33,29,24,.04);
--shadow-2:0 12px 28px -12px rgba(33,29,24,.20);
--shadow-3:0 22px 48px -20px rgba(33,29,24,.28);
--overlay:rgba(33,24,16,.04);
--pattern:rgba(33,29,24,.05);
--grain:rgba(33,29,24,.025)}
html[data-theme="dark"]{
--bg:#0F1826;--bg-subtle:#152133;
--card:#1A2740;--card-hover:#20304D;
--text:#EDF1F7;--text-muted:#A6B4CB;--text-faint:#71809B;
--border:#28374F;--border-strong:#334764;
--accent:#DFAF56;--accent-strong:#EFC578;--accent-ink:#2A2013;
--header-bg:rgba(15,24,38,.78);
--shadow-1:0 1px 2px rgba(0,0,0,.35);
--shadow-2:0 16px 32px -14px rgba(0,0,0,.6);
--shadow-3:0 24px 56px -22px rgba(0,0,0,.7);
--overlay:rgba(0,0,0,.16);
--pattern:rgba(255,255,255,.04);
--grain:rgba(255,255,255,.018);
--b6:#5C93BA;--b6-soft:#5C93BA1a}

/* ========== Layout ========== */
.container{width:100%;max-width:1180px;margin-inline:auto;padding-inline:var(--space-5)}
@media (min-width:768px){.container{padding-inline:var(--space-8)}}

/* ========== Skip link ========== */
.skip-link{position:fixed;top:-100px;inset-inline-start:var(--space-4);z-index:200;background:var(--text);color:var(--bg);font-weight:800;font-size:13.5px;padding:12px 20px;border-radius:var(--radius-md);box-shadow:var(--shadow-3);transition:top var(--dur-fast) var(--ease)}
.skip-link:focus{top:var(--space-4)}

/* ========== Back to top ========== */
.to-top{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-2);opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity var(--dur-med) var(--ease),transform var(--dur-med) var(--ease-out),visibility 0s linear var(--dur-med),border-color var(--dur-fast) var(--ease)}
.to-top.show{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.to-top:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.to-top svg{width:19px;height:19px;stroke-width:2.4}
@media (max-width:640px){.to-top{bottom:calc(16px + env(safe-area-inset-bottom,0px));width:42px;height:42px}}

/* ========== Header ========== */
.site-header{position:sticky;top:0;z-index:40;background:var(--header-bg);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border-bottom:1px solid var(--border);transition:background var(--dur-med) var(--ease),border-color var(--dur-med) var(--ease)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);padding-block:var(--space-4);min-height:64px}
.brand{display:flex;align-items:center;gap:var(--space-3);min-width:0;text-decoration:none;color:inherit}
.brand-mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(155deg,var(--accent),var(--accent-strong));display:flex;align-items:center;justify-content:center;color:var(--accent-ink);flex:none;box-shadow:var(--shadow-1);transition:transform var(--dur-med) var(--ease-out)}
.brand:hover .brand-mark{transform:rotate(-6deg) scale(1.04)}
.brand-mark svg{width:22px;height:22px;stroke-width:2.2}
.brand-text{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand-text strong{font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--text)}
.brand-text span{font-size:11.5px;color:var(--text-muted);font-weight:600;margin-top:2px}
.header-controls{display:flex;align-items:center;gap:var(--space-2)}
.lang-switch{display:flex;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-pill);padding:3px;gap:2px;box-shadow:var(--shadow-1)}
.lang-switch button{padding:6px 12px;border-radius:var(--radius-pill);font-weight:800;font-size:11.5px;letter-spacing:.06em;color:var(--text-muted);transition:color var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease);min-width:36px}
.lang-switch button:hover{color:var(--text)}
.lang-switch button.active{background:var(--text);color:var(--bg);box-shadow:var(--shadow-1)}
.icon-btn{position:relative;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-pill);background:var(--card);border:1px solid var(--border);cursor:pointer;transition:transform var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease);flex:none;-webkit-user-select:none;user-select:none;box-shadow:var(--shadow-1);color:var(--text)}
.icon-btn:hover{transform:translateY(-1px);border-color:var(--border-strong);background:var(--card-hover)}
.icon-btn:active{transform:translateY(0)}
.icon-btn svg{width:18px;height:18px;stroke-width:2.2}
.fav-badge{position:absolute;top:-3px;inset-inline-end:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#E0435B;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 0 2px var(--bg);pointer-events:none}
.fav-badge[hidden]{display:none}

/* ========== Hero ========== */

document.querySelectorAll('.fav-toggle[data-fav-key]').forEach(btn=>{

btn.setAttribute('aria-pressed', active ? 'true' : 'false');
});
}
function _favEntries(){
const out = [];
_favs.forEach(key=>{

const cat = buffet.categories.find(c=>c.id===cId);

const item = cat.items.find(it=>it.name.fa===nameFa);
if(!item) return;
out.push({buffet, cat, item, key});
});
return out;
}

function _tfDef(qid,a){
  if(qid==='kind') return _tfQ.kind;
  if(qid==='sub') return _tfQ.sub[a.kind] || {q:_L('',''), o:[]};
  if(qid==='people') return _tfQ.people;
  if(qid==='budget'){
    const L = _TF_LIM[a.kind] || _TF_LIM.meal;
    return {q:_tfQ.budgetQ, o:[
      {id:'eco', l:_L('اقتصادی','Budget-friendly'), h:_L(`تا ${_fp(L[0],'fa')} تومان برای هر نفر`, `Up to ${L[0]} Toman per person`)},
      {id:'mid', l:_L('متوسط','Mid-range'), h:_L(`تا ${_fp(L[1],'fa')} تومان برای هر نفر`, `Up to ${L[1]} Toman per person`)},
      {id:'high', l:_L('مهم نیست','No limit'), h:_L('بهترین را پیشنهاد بده','Show me the best')}
    ]};
  }
  if(a.kind==='meal'||a.kind==='bite') return _tfQ.prefP;
  if(a.kind==='hot') return _tfQ.prefH;
  return _tfQ.prefS;
}
function _tfOpt(qid,a){
  const id = a[qid]; if(!id) return null;
  return _tfDef(qid,a).o.find(o=>o.id===id) || null;
}

/* ---- Item features (derived from the menu data, so new items are picked up automatically) ---- */
function _tfK(s){
  return String(s||'').replace(/&amp;/g,'&').replace(/[\u200c\u200f\s]/g,'').replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase();
}
function _tfAdd(arr){ for(let i=1;i<arguments.length;i++){ if(!arr.includes(arguments[i])) arr.push(arguments[i]); } }
function _tfFeat(b,c,it){
  const n = _tfK(it.name.fa);
  const d = _tfK(it.description && it.description.fa);
  const en = (String(it.name.en||'') + ' ' + String((it.description && it.description.en) || '')).replace(/&amp;/g,'&').toLowerCase();
  const s = n + ' ' + d + ' ' + en;
  const f = {kinds:[], sub:null, style:[], protein:[], taste:[], serves:1};
  switch(b.id){
    case 'tea-house':
      if(c.id==='hookah'){ _tfAdd(f.kinds,'hot'); f.sub='hookah'; }
      else if(c.id==='herbal'){ _tfAdd(f.kinds,'hot'); f.sub='herbal'; }
      else if(/چای/.test(n)){ _tfAdd(f.kinds,'hot'); f.sub='tea'; }
      else if(/کوک/.test(n)){ _tfAdd(f.kinds,'drink'); f.sub='soda'; }
      else { _tfAdd(f.kinds,'sweet'); f.sub='cake'; }
      break;
    case 'gheimeh-ghormeh': _tfAdd(f.kinds,'meal'); _tfAdd(f.style,'irani'); break;
    case 'bastani':
      if(c.id==='juice'||c.id==='mixjuice'){ _tfAdd(f.kinds,'drink'); f.sub='juice'; }
      else if(c.id==='icecream'){ _tfAdd(f.kinds,'sweet'); f.sub='icecream'; }
      else if(/کیک/.test(n)){ _tfAdd(f.kinds,'sweet'); f.sub='cake'; }
      else { _tfAdd(f.kinds,'drink','sweet'); f.sub = /شیرموز|شیرپسته/.test(n) ? 'milk' : 'shake'; }
      break;
    case 'sokhari': _tfAdd(f.kinds,'meal','bite'); _tfAdd(f.style,'fried'); break;
    case 'burger-pasta':
      _tfAdd(f.kinds,'meal'); _tfAdd(f.style,'burgerpasta');
      if(c.id==='fries-salad-items'){ _tfAdd(f.kinds,'bite'); if(/سیب/.test(n)) _tfAdd(f.style,'fried'); }
      break;
    case 'pizza':
      _tfAdd(f.kinds,'meal'); _tfAdd(f.style,'pizza');
      if(/نانسیر/.test(n)) _tfAdd(f.kinds,'bite');
      break;
    case 'dahe60':
      _tfAdd(f.kinds,'bite'); _tfAdd(f.style,'retro');
      if(c.id==='tray') _tfAdd(f.kinds,'meal');
      break;
    case 'world-food':
      _tfAdd(f.kinds,'bite'); _tfAdd(f.style, c.id==='falafel' ? 'falafel' : 'world');
      break;
    default: _tfAdd(f.kinds,'meal');
  }
  // portion size
  f.serves = Number(it.serves) || (/چهارنفره|خانواده/.test(n) ? 4 : /نیممتری/.test(n) ? 4 : /سوپرویژه/.test(n) ? 3 : /دونفره/.test(n) ? 2 : c.id==='double' ? 2 : 1);
  // protein (only meaningful for food)
  if(f.kinds.includes('meal') || f.kinds.includes('bite')){
    if(/شاورمامیکس|mixshawarma/.test(n + ' ' + en.replace(/\s/g,''))) _tfAdd(f.protein,'chicken','beef');
    if(/مرغ|فیله|چیکن|chicken|fillet/.test(s)) _tfAdd(f.protein,'chicken');
    if(/گوشت|بیف|چرخکرده|برگر|کتلت|رست|مغز|کباب|قیمه|قرمه|beef|burger|patty|ground|cutlet|roast|brain|kabab|kebab/.test(s)) _tfAdd(f.protein,'beef');
    if(/سوسیس|کالباس|ژامبون|هاتداگ|پپرونی|پیرونی|بلغاری|مارتادلا|کوکتل|^بندری|^هندی|sausage|\bham\b|pepperoni|pironi|cold cuts|mortadella|hot ?dog|cocktail/.test(s)) _tfAdd(f.protein,'sausage');
  }
  // taste
  if(f.kinds.includes('hot')){
    if(/نعنا|(^|[^ش])یخ|mint|\bice\b/.test(s)) _tfAdd(f.taste,'cool');
    if(/میوه|سیب|هلو|آلبالو|انبه|انگور|هندوانه|بلوبری|شلیل|پرتقال|لیمو|طالبی|فصلی|اپی|موز|fruit|apple|peach|cherry|mango|grape|melon|blueberry|nectarine|orange|lemon|seasonal|banana/.test(s)) _tfAdd(f.taste,'fruity');
    if(/خامه|شیر(?!از)|آدامس|بیسکویت|عسل|cream|milk|\bgum\b|biscuit|honey/.test(s)) _tfAdd(f.taste,'creamy');
    if(/^چایکلاسیک|چایسبز|زعفران|گاوزبان|سلامت|مصری|بهلیمو/.test(n) || /^دوسیب$/.test(n)) _tfAdd(f.taste,'classic');
  }
  if(f.kinds.includes('drink') || f.kinds.includes('sweet')){
    if(/شکلات|نوتلا|لوتوس|شوکو|بادامزمینی|تیرامیسو|chocolate|nutella|lotus|choco|peanut|tiramisu/.test(s)) _tfAdd(f.taste,'chocolate');
    if(/توتفرنگی|طالبی|سیب|هندوانه|انبه|موز|strawberry|cantaloupe|apple|watermelon|mango|banana|berry/.test(s)) _tfAdd(f.taste,'fruit');
    if(/شیر(?!از)|پسته|خرما|نارگیل|مغز|بستنی|آیسپک|معجون|خامه|تیرامیسو|tiramisu|milk|pistachio|\bdate\b|coconut|\bnuts\b|ice ?cream|ice pack|smoothie|cream/.test(s)) _tfAdd(f.taste,'creamy');
  }
  return f;
}
let _tfCache = null;
function _tfAll(){
  if(_tfCache) return _tfCache;
  const out = [];
  _dt.buffets.forEach(b=>b.categories.forEach(c=>c.items.forEach(it=>{ out.push({b, c, it, f:_tfFeat(b,c,it)}); })));
  return (_tfCache = out);
}

/* ---- Scoring ---- */
function _tfMatch(m,f){
  if(!m) return true;
  if(m.style) return f.style.includes(m.style);
  if(m.sub) return [].concat(m.sub).includes(f.sub);
  if(m.protein) return f.protein.includes(m.protein);
  if(m.taste) return f.taste.includes(m.taste);
  return true;
}
function _tfPool(a){
  const so = _tfOpt('sub',a);
  return _tfAll().filter(x=>x.f.kinds.includes(a.kind) && _tfMatch(so && so.m, x.f));
}
function _tfSteps(a){
  const withPeople = k => k==='meal' || k==='bite' || k==='hot';
  const s = ['kind','sub'];
  if(!a.kind || !a.sub){
    if(!a.kind || withPeople(a.kind)) s.push('people');
    s.push('budget','pref');
    return s;
  }
  if(_tfPool(a).length <= 3) return s;
  const hk = a.sub === 'hookah';
  if(withPeople(a.kind) && !hk) s.push('people');
  if(!hk) s.push('budget');
  s.push('pref');
  return s;
}
function _tfDay(){ const d = new Date(); return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate(); }
function _tfHash(str){ let h = 2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }
function _tfJit(str){ return (_tfHash(str + '|' + _tfDay()) % 1000) / 1000; }

function _tfRank(a){
  const so = _tfOpt('sub',a), po = _tfOpt('pref',a);
  const lim = _TF_LIM[a.kind] || _TF_LIM.meal;
  const seen = new Map();
  _tfAll().forEach(x=>{
    const f = x.f, it = x.it;
    if(!f.kinds.includes(a.kind)) return;
    let s = 0;
    const why = {pref:false, budget:false, people:false};
    const subOk = _tfMatch(so && so.m, f);
    if(so && so.m) s += subOk ? 50 : -100;
    const sv = f.serves;
    if(a.people==='solo') s += sv===1 ? 15 : -10;
    else if(a.people==='duo'){ s += sv===2 ? 20 : sv===1 ? 5 : 8; why.people = sv>=2; }
    else if(a.people==='group'){ s += sv>=3 ? 25 : sv===2 ? 12 : 0; why.people = sv>=2; }
    if(it.price==null) s -= 6;
    else if(a.budget){
      const pp = it.price / sv;
      if(a.budget==='high') s += Math.min(6, pp/120);
      else {
        const L = lim[a.budget==='eco' ? 0 : 1];
        if(pp <= L){ s += 12; why.budget = true; }
        else s -= 15 + (pp-L)/4;
      }
    }
    if(po && po.m){
      const key = po.m.protein ? 'protein' : 'taste';
      if(_tfMatch(po.m,f)){ s += 40; why.pref = true; }
      else if(f[key].length) s -= (key==='protein' ? 15 : 8);
    }
    s += _tfJit(x.b.id + it.name.fa) * 1.5;
    const key = x.b.id + '|' + _tfK(it.name.fa);
    const prev = seen.get(key);
    if(!prev || prev.s < s) seen.set(key, {x, s, subOk, why});
  });
  return Array.from(seen.values()).sort((p,q)=>q.s-p.s);
}
function _tfResults(a){
  const ranked = _tfRank(a);
  const good = ranked.filter(r=>r.subOk);
  return (good.length >= 3 ? good : ranked).slice(0,9);
}
let _tfTodayCache = null;
function _tfToday(){
  const day = _tfDay();
  if(_tfTodayCache && _tfTodayCache.day === day) return _tfTodayCache.rec;
  const pool = _tfAll().filter(x=>x.it.price!=null && x.it.price>=150 && !x.f.kinds.includes('hot') && x.f.sub!=='soda');
  if(!pool.length) return null;
  const x = pool[_tfHash('today|' + day) % pool.length];
  const rec = {x, s:0, subOk:true, why:{pref:false,budget:false,people:false}};
  _tfTodayCache = {day, rec};
  return rec;
}

/* ---- UI ---- */
const _tf = {open:false, screen:'intro', qi:0, a:{}, page:0, shown:[], today:null, busy:false, lastFocus:null};
const _tfEl = {};
function _tfInit(){
  if(_tfEl.fab) return;
  _tfEl.root = document.getElementById('tf-root');
  _tfEl.fab = document.getElementById('tf-fab');
  _tfEl.fabTx = document.getElementById('tf-fab-tx');
  _tfEl.panel = document.getElementById('tf-panel');
  _tfEl.backdrop = document.getElementById('tf-backdrop');
  _tfEl.fab.addEventListener('click', _tfOpen);
  _tfEl.backdrop.addEventListener('click', ()=>_tfClose());
  const stop = e=>e.preventDefault();
  _tfEl.backdrop.addEventListener('wheel', stop, {passive:false});
  _tfEl.backdrop.addEventListener('touchmove', stop, {passive:false});
  _tfEl.panel.addEventListener('click', _tfOnClick);
  document.addEventListener('keydown', e=>{
    if(!_tf.open) return;
    if(e.key==='Escape'){ e.preventDefault(); _tfClose(); return; }
    if(e.key!=='Tab') return;
    const list = Array.from(_tfEl.panel.querySelectorAll('button')).filter(el=>!el.disabled && el.offsetParent!==null);
    if(!list.length) return;
    const first = list[0], last = list[list.length-1], cur = document.activeElement;
    const inside = _tfEl.panel.contains(cur);
    if(e.shiftKey && (cur===first || !inside)){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && (cur===last || !inside)){ e.preventDefault(); first.focus(); }
  });
}
function _tfSync(){
  _tfInit();
  const t = _tfT[_st.lang];
  const home = _st.view === 'home';
  _tfEl.fab.hidden = !home;
  if(!home) _tfClose(true);
  _tfEl.fabTx.textContent = t.fab;
  _tfEl.fab.setAttribute('aria-label', t.fab);
  _tfEl.panel.setAttribute('aria-label', t.title);
  if(_tf.open) _tfRender();
}
function _tfOpen(){
  if(_tf.open) return;
  _tf.open = true;
  _tf.lastFocus = document.activeElement;
  _tfEl.root.classList.add('tf-open');
  _tfEl.fab.setAttribute('aria-expanded','true');
  _tfRender(true);
}
function _tfClose(silent){
  if(!_tf.open) return;
  _tf.open = false;
  _tfEl.root.classList.remove('tf-open');
  _tfEl.fab.setAttribute('aria-expanded','false');
  if(!silent && _tf.lastFocus && document.contains(_tf.lastFocus) && !_tfEl.fab.hidden){ _tf.lastFocus.focus(); }
}
function _tfOnClick(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  if(act==='close') return _tfClose();
  if(act==='start'){ _tf.screen='quiz'; _tf.qi=0; return _tfRender(true); }
  if(act==='pick'){
    if(_tf.busy) return;
    _tf.busy = true;
    el.classList.add('sel');
    const q = el.dataset.q, id = el.dataset.id;
    setTimeout(()=>{ _tf.busy = false; _tfPick(q,id); }, 170);
    return;
  }
  if(act==='back'){
