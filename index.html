@media (min-width:640px){.footer-inner{flex-direction:row;justify-content:space-between;text-align:start}}
.footer-address{margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--border);text-align:center;color:var(--text-faint);font-size:12.5px;font-weight:600;letter-spacing:.01em}

/* ========== Animations / Reduced motion ========== */
@keyframes bgFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.001ms !important;transition-duration:0.001ms !important}html{scroll-behavior:auto}}

/* ========== Mobile-specific ========== */
@media (max-width:640px){
.buffet-card{padding:var(--space-5);min-height:0}
.buffet-icon{width:42px;height:42px;border-radius:12px}
.buffet-card h3{font-size:16.5px}
.detail-icon{width:52px;height:52px;border-radius:14px}
.detail-icon svg{width:24px;height:24px}
.food-row{padding:var(--space-3) var(--space-4);gap:var(--space-3)}
.food-main{padding-inline-start:var(--space-3)}
.food-main h4{font-size:14px}
.food-main p{font-size:12px}
.food-price{font-size:14px}
.food-price .unit{font-size:10px}
.tab-pill{padding:8px 14px;font-size:12.5px}
}

/* ========== Print ========== */
@media print{
.site-header,footer{display:none}
.hero{display:none}
.buffet-card,.food-row{break-inside:avoid;box-shadow:none;border:1px solid #999;background:#fff !important;color:#000 !important}
.food-price{color:#000 !important}
.detail-header{background:none !important;border:none}
}

/* ========== Loading bar ========== */
.progress-bar{position:fixed;top:0;right:0;left:0;height:2px;background:var(--accent);z-index:100;transform-origin:right;transform:scaleX(0);transition:transform var(--dur-med) var(--ease-out)}
.progress-bar.active{transform:scaleX(1)}
html[lang="en"] .progress-bar{transform-origin:left}
</style>

function _ri(){ if(window.lucide) window.lucide.createIcons(); }
function _debounce(fn, wait){
let timer;
return function(...args){
clearTimeout(timer);
timer = setTimeout(()=>fn.apply(this, args), wait);
};
}

function _showProgress(){
if(!_pb) return;
_pb.classList.add('active');
clearTimeout(_showProgress._t);
_showProgress._t = setTimeout(()=>_pb.classList.remove('active'), 320);
}

function _as(){
const n = 14;
let arches = '';
const w = 60;
for(let i=0;i<n;i++){
const x = i*w + w/2;
arches += `<path d="M ${x-22} 46 L ${x-22} 22 A 22 22 0 0 1 ${x+22} 22 L ${x+22} 46" fill="none" stroke="currentColor" stroke-width="1.4"/>`;
}
return `<svg class="arches" viewBox="0 0 ${n*w} 50" preserveAspectRatio="none" aria-hidden="true">${arches}</svg>`;
}

function _bCard(b, t){
const count = b.categories.reduce((sum,c)=>sum+c.items.length,0);
return `
<button type="button" class="buffet-card" data-buffet="${b.id}" style="--card-accent:${b.accent}; --card-accent-soft:${b.accentSoft};" aria-label="${_es(b.name[_st.lang])} – ${t.viewMenu}">
<span class="buffet-icon" aria-hidden="true">${_ic(b.icon)}</span>
<div>
<h3>${_es(b.name[_st.lang])}</h3>
<p class="desc">${_es(b.description[_st.lang])}</p>
</div>
<div class="buffet-card-foot">
<span class="item-count num">${t.itemsCount(count)}</span>
<span class="go-arrow" aria-hidden="true">${_ic(_st.lang==='fa' ? 'arrow-left' : 'arrow-right')}</span>
</div>
</button>`;
}

function _homeResultsHTML(t, query){
if(query){
const matchedBuffets = _dt.buffets.filter(b =>
(b.name[_st.lang]||'').toLowerCase().includes(query) ||
(b.description[_st.lang]||'').toLowerCase().includes(query)
);
const matchedItems = [];
_dt.buffets.forEach(b=>{
b.categories.forEach(c=>{
c.items.forEach(it=>{
const nameMatch = (it.name[_st.lang]||'').toLowerCase().includes(query);
const descMatch = it.description && it.description[_st.lang] && it.description[_st.lang].toLowerCase().includes(query);
if(nameMatch || descMatch) matchedItems.push({item:it, buffet:b});
});
});
});
if(!matchedBuffets.length && !matchedItems.length){
return `
<div class="empty-state view">
<div class="ic">${_ic('search-x')}</div>
<h3>${t.homeSearchEmptyTitle}</h3>
<p>${t.homeSearchEmptyDesc}</p>
</div>`;
}
const buffetsBlock = matchedBuffets.length ? `
<div class="group-heading"><h5>${_es(t.matchingBuffets)}</h5></div>
<div class="buffet-grid view view-stagger">${matchedBuffets.map(b=>_bCard(b,t)).join('')}</div>` : '';
const itemsBlock = matchedItems.length ? `
<div class="group-heading"><h5>${_es(t.matchingItems)}</h5></div>
<div class="menu-list view">
${matchedItems.map(({item,buffet})=>{
const priceKnown = item.price !== null && item.price !== undefined;
return `
<button type="button" class="food-row result-row" data-buffet="${buffet.id}" style="--row-accent:${buffet.accent};">
<div class="food-main">
<div class="result-tag">${_es(buffet.name[_st.lang])}</div>
<h4>${_es(item.name[_st.lang])}</h4>
${item.description ? `<p>${_es(item.description[_st.lang])}</p>` : ''}
</div>
<div class="food-price num ${priceKnown ? '' : 'unknown'}">
${priceKnown ? _fp(item.price, _st.lang) : t.priceUnknown}
${priceKnown ? `<span class="unit">${t.currency}</span>` : ''}
</div>
</button>`;
}).join('')}
</div>` : '';
return `${buffetsBlock}${itemsBlock}`;
}
return `<div class="buffet-grid view view-stagger">${_dt.buffets.map(b=>_bCard(b,t)).join('')}</div>`;
}

function _menuItemsHTML(buffet, t, search){
const showTabs = buffet.categories.length > 1;
const rowHTML = (item)=>{
const priceKnown = item.price !== null && item.price !== undefined;
return `
<article class="food-row" style="--row-accent:${buffet.accent};">
<div class="food-main">
<h4>${_es(item.name[_st.lang])}</h4>
${item.description ? `<p>${_es(item.description[_st.lang])}</p>` : ''}
</div>
<div class="food-price num ${priceKnown ? '' : 'unknown'}">
${priceKnown ? _fp(item.price, _st.lang) : t.priceUnknown}
${priceKnown ? `<span class="unit">${t.currency}</span>` : ''}
</div>
</article>`;
};
const emptyHTML = `
<div class="empty-state view">
<div class="ic">${_ic('search-x')}</div>
<h3>${t.searchEmptyTitle}</h3>
<p>${t.searchEmptyDesc}</p>
</div>`;
let itemsHTML;
if(search){
const groups = buffet.categories.map(c=>({
cat:c,
items: c.items.filter(it => (it.name[_st.lang]||'').toLowerCase().includes(search) || (it.description && it.description[_st.lang] && it.description[_st.lang].toLowerCase().includes(search)))
})).filter(g=>g.items.length>0);
itemsHTML = groups.length ? groups.map(g=>`
${buffet.categories.length>1 ? `<div class="group-heading"><h5>${_es(g.cat.name[_st.lang])}</h5></div>` : ''}
${g.items.map(rowHTML).join('')}
`).join('') : emptyHTML;
} else {
const activeCat = buffet.categories.find(c=>c.id===_st.activeCategoryId) || buffet.categories[0];
const items = activeCat.items;
itemsHTML = items.length ? items.map(rowHTML).join('') : emptyHTML;
}
const activeCatForHeading = buffet.categories.find(c=>c.id===_st.activeCategoryId) || buffet.categories[0];
return `${!showTabs && !search ? `<div class="group-heading"><h5>${_es(activeCatForHeading.name[_st.lang])}</h5></div>` : ''}${itemsHTML}`;
}
